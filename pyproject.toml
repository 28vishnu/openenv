[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openenv-submission"
version = "0.1.0"
description = "Round 1 OpenEnv Submission"
dependencies = [
    "fastapi",
    "uvicorn",
    "openai",
    "python-multipart",
    "openenv-core>=0.2.0"
]

[project.scripts]
# This MUST point to the main function in your app.py
server = "server.app:main"
